# ai-toolbox config (~/.config/ai-toolbox/config.toml).
#
# Providers (the table name is yours; `type` defaults to the table name):
#   claude → Claude Code CLI, using your logged-in Claude subscription
#   codex  → Codex CLI, using your logged-in ChatGPT subscription
#   openai → any OpenAI-compatible endpoint: Ollama, LM Studio, llama.cpp...
# `model` here is each provider's default; commands can override it.

default_provider = "claude"

# Nothing highlighted? Send Ctrl+C to the app and use what it copies.
# Off by default: some apps copy the whole line when nothing is selected.
# Never sent to the terminals below.
copy_fallback = false

# Personal dictionary: product names, acronyms, jargon. Never translated,
# corrected or recapitalized by any command or translation.
glossary = []

# Window classes that paste with Ctrl+Shift+V.
terminal_classes = ["foot", "org.codeberg.dnkl.foot", "kitty", "Alacritty", "com.mitchellh.ghostty", "org.wezfurlong.wezterm"]

[providers.claude]
model = "haiku"

[providers.codex]
model = "gpt-5.6-luna"
reasoning = "low"

# Local models, e.g. Ollama (`ollama pull llama3.2`):
# [providers.ollama]
# type = "openai"
# base_url = "http://localhost:11434/v1"
# model = "llama3.2"
# api_key_env = "MY_API_KEY"   # only for endpoints that need a key

[dictation]
# Local speech-to-text (Whisper). First use installs it (~1 GB with GPU libs).
model = "large-v3-turbo"   # NVIDIA GPU
cpu_model = "small"        # no GPU: tiny, base, small, medium
device = "auto"            # auto | cuda | cpu
language = ""              # "" = detect, or "pt", "en"...
then = ""                  # e.g. "fix-spelling": run a command on the transcript first
idle_unload_minutes = 10

[history]
# The last results you replaced, pasted or copied: History in the palette,
# `ai-toolbox history` in a terminal. Kept in ~/.local/state/ai-toolbox/history.json
# (only you can read it) and never sent anywhere.
enabled = true
max_entries = 50

[translate]
# "Auto" target: text in one of these goes to the other.
pair = ["English", "Portuguese (Brazil)"]
languages = ["Spanish", "French", "German", "Italian", "Japanese", "Chinese (Simplified)"]

# Literal: fast and faithful. Contextual (Ctrl+I): reads context.md.
literal = { provider = "claude", model = "haiku" }
contextual = { provider = "claude", model = "sonnet" }
