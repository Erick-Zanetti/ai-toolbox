name = "Fix spelling"
# window: show the result first, Ctrl+Enter replaces the selection.
# replace: rewrite the selection in place, no window (like Raycast's Quick Fix).
output = "window"
# provider / model are optional; they fall back to config.toml.
model = "haiku"
prompt = """
Fix spelling, grammar and punctuation in the text. Change as little as possible:
keep the wording, tone, language and formatting. If it is already correct,
return it unchanged.

<text>
{selection}
</text>
"""
