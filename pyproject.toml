[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-toolbox"
version = "0.1.0"
description = "Raycast-style AI text commands and translator for Wayland desktops"
readme = "README.md"
license = "MIT"
authors = [{ name = "Erick Zanetti" }]
requires-python = ">=3.11"
# PyGObject comes from the system (GTK 4 + libadwaita): install with
# --system-site-packages or from your distro package.
dependencies = []

[project.urls]
Homepage = "https://github.com/Erick-Zanetti/ai-toolbox"

[project.scripts]
ai-toolbox = "ai_toolbox.cli:main"

[tool.setuptools.packages.find]
include = ["ai_toolbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# Translation tables and D-Bus XML read better on one line.
"ai_toolbox/i18n.py" = ["E501"]
"tests/portal_mock.py" = ["E501"]
